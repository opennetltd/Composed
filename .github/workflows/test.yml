name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xcode_tests:
    name: Tests (Xcode ${{ matrix.xcode }}; iOS ${{ matrix.ios-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-26"
            xcode: "26.2"
            # 15.0 has a max macOS version of 14.99.0. I think 15.5 is the oldest version to support 26.x.
            ios-version: "15.5"
            platform-requires-installation: true
            device: "iPhone 13"
          - os: "macos-26"
            xcode: "26.2"
            ios-version: "16.0"
            platform-requires-installation: true
            device: "iPhone 14"
          - os: "xcode-27"
            xcode: "27.2"
            ios-version: "17.0"
            platform-requires-installation: true
            device: "iPhone 15"
          # This could use Xcode 27.2 but some SDKs fail to download from the CLI. See https://developer.apple.com/forums/thread/847134
          - os: "macos-26"
            xcode: "26.6"
            ios-version: "18.0"
            platform-requires-installation: true
            device: "iPhone 16"
          - os: "xcode-27"
            xcode: "27.2"
            ios-version: "26.0"
            platform-requires-installation: true
            device: "iPhone 17"
          - os: "macos-26"
            xcode: "26.2"
            ios-version: "26.2"
            device: "iPhone 17"
          - os: "xcode-27"
            xcode: "27.0"
            ios-version: "27.0"
            device: "iPhone 18 Pro"
          - os: "xcode-27"
            xcode: "27.2"
            ios-version: "27.2"
            device: "iPhone 18 Pro"

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select --switch "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Install iOS ${{ matrix.ios-version }}
        if: ${{ matrix.platform-requires-installation }}
        env:
            IOS_VERSION: ${{ matrix.ios-version }}
        run: |
          xcodes runtimes
          sudo xcodes runtimes install "iOS ${{ matrix.ios-version }}"
          echo "IOS_RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION/\./-}" >> $GITHUB_ENV

      - name: Create ${{ matrix.device }} (${{ matrix.ios-version }}) Simulator
        if: ${{ matrix.platform-requires-installation }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail

          echo "Device: $DEVICE"
          echo "Runtime: $IOS_RUNTIME"

          if SIMULATOR_DESTINATION=$(xcrun simctl create "$DEVICE" "$DEVICE" "$IOS_RUNTIME"); then
            echo "Created simulator: $SIMULATOR_DESTINATION"
          else
            status=$?
            echo "::error::simctl create failed with exit code $status"
            exit "$status"
          fi

          if [[ -z "$SIMULATOR_DESTINATION" ]]; then
            xcrun simctl list devices available
            echo "::error::simctl create succeeded but returned no UUID"
            exit 1
          fi

          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_DESTINATION" >> $GITHUB_ENV

          # Attempt to boot to ensure it's valid. Also reduces the delay of Xcode waiting for the simulator?
          xcrun simctl bootstatus "$SIMULATOR_DESTINATION" -b

      - name: Populate SIMULATOR_DESTINATION
        if: ${{ !matrix.platform-requires-installation }}
        run: echo "SIMULATOR_DESTINATION=platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios-version }}" >> $GITHUB_ENV

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - run: mint bootstrap

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package@swift-*.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run Tests
        run: set -o pipefail && xcodebuild test -scheme Composed-Package -destination "$SIMULATOR_DESTINATION" 2>&1 | $(mint which xcbeautify) --renderer github-actions preserve-unbeautified
